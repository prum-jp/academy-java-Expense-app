services:
  mysql:
    image: mysql:8.4
    container_name: expense-mysql
    environment:
      MYSQL_DATABASE: expense_db
      MYSQL_USER: expense_user
      MYSQL_PASSWORD: expense_pass
      MYSQL_ROOT_PASSWORD: root_pass
      TZ: Asia/Tokyo
      LANG: C.UTF-8
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_0900_ai_ci
    volumes:
      - expense-mysql-data:/var/lib/mysql
      - ./docker/mysql/conf.d:/etc/mysql/conf.d:ro
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "3307:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot_pass"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks:
      - expense-net

  app:
    build: .
    container_name: expense-app
    ports:
      - "8081:8081"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      TZ: Asia/Tokyo
    volumes:
      - expense-receipts:/app/uploads/receipts
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - expense-net

volumes:
  expense-mysql-data:
  expense-receipts:

networks:
  expense-net:
