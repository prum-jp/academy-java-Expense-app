spring.application.name=java-Expense-app
server.port=8081

# ホストから起動する場合の DB は docker compose の MySQL（3307）。
# コンテナ内では application-docker.properties が mysql:3306 に上書きする。
spring.datasource.url=jdbc:mysql://localhost:3307/expense_db?useUnicode=true&characterEncoding=UTF-8&connectionCollation=utf8mb4_0900_ai_ci&serverTimezone=Asia/Tokyo&allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.username=expense_user
spring.datasource.password=expense_pass
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

mybatis.mapper-locations=classpath:mapper/*.xml
mybatis.type-aliases-package=com.example.expenseapp.entity
mybatis.configuration.map-underscore-to-camel-case=true

spring.thymeleaf.cache=false
spring.messages.basename=messages
spring.messages.encoding=UTF-8

server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB
app.upload.receipt-dir=uploads/receipts
