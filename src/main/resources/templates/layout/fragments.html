<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title} + ' | ' + #{app.name}">Expense App</title>
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/5.3.3/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/webjars/bootstrap-icons/1.11.3/font/bootstrap-icons.css}">
    <link th:href="@{/css/app.css}" rel="stylesheet">
</head>

<nav th:fragment="navbar" class="navbar navbar-expand-lg navbar-dark app-navbar">
    <div class="container">
        <a class="navbar-brand" th:href="@{/}">
            <i class="bi bi-receipt-cutoff me-2"></i><span th:text="#{app.name}">経費精算</span>
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="mainNav">
            <ul class="navbar-nav me-auto">
                <li class="nav-item" sec:authorize="hasRole('USER')">
                    <a class="nav-link" th:href="@{/expenses}" th:classappend="${requestUri != null and #strings.startsWith(requestUri, '/expenses')} ? 'active'">
                        <i class="bi bi-list-ul me-1"></i>マイ経費
                    </a>
                </li>
                <li class="nav-item" sec:authorize="hasRole('USER')">
                    <a class="nav-link" th:href="@{/expenses/new}">
                        <i class="bi bi-plus-circle me-1"></i>新規申請
                    </a>
                </li>
                <li class="nav-item" sec:authorize="hasRole('APPROVER')">
                    <a class="nav-link" th:href="@{/approvals}" th:classappend="${requestUri != null and #strings.startsWith(requestUri, '/approvals')} ? 'active'">
                        <i class="bi bi-check2-square me-1"></i>承認待ち
                    </a>
                </li>
            </ul>
            <ul class="navbar-nav">
                <li class="nav-item dropdown" sec:authorize="isAuthenticated()">
                    <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown">
                        <i class="bi bi-person-circle me-1"></i>
                        <span sec:authentication="name">user</span>
                    </a>
                    <ul class="dropdown-menu dropdown-menu-end">
                        <li class="dropdown-item-text text-muted small" th:if="${currentUser != null}">
                            <span th:text="${currentUser.deptName}">部署</span> /
                            <span th:text="${currentUser.positionName}">役職</span>
                        </li>
                        <li><hr class="dropdown-divider"></li>
                        <li><a class="dropdown-item" th:href="@{/password/change}">
                            <i class="bi bi-key me-2"></i><span th:text="#{password.title}">パスワード変更</span>
                        </a></li>
                        <li>
                            <form th:action="@{/logout}" method="post" class="px-3 py-1">
                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                                <button type="submit" class="dropdown-item text-danger px-0">
                                    <i class="bi bi-box-arrow-right me-2"></i>ログアウト
                                </button>
                            </form>
                        </li>
                    </ul>
                </li>
            </ul>
        </div>
    </div>
</nav>

<div th:fragment="alerts">
    <div class="container mt-3" th:if="${successMessage}">
        <div class="alert alert-success alert-dismissible fade show" role="alert">
            <i class="bi bi-check-circle me-2"></i><span th:text="${successMessage}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
    </div>
    <div class="container mt-3" th:if="${errorMessage}">
        <div class="alert alert-danger alert-dismissible fade show" role="alert">
            <i class="bi bi-exclamation-triangle me-2"></i><span th:text="${errorMessage}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
    </div>
</div>

<footer th:fragment="footer" class="app-footer text-center">
    <div class="container">
        <span th:text="#{app.footer}">© Expense App</span>
    </div>
</footer>

<th:block th:fragment="scripts">
    <script th:src="@{/webjars/bootstrap/5.3.3/js/bootstrap.bundle.min.js}"></script>
</th:block>
