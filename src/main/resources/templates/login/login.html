<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/fragments :: head(#{login.title})}"></head>
<body>
<div class="login-wrapper">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-5 col-lg-4">
                <div class="card login-card">
                    <div class="card-body p-4 p-md-5">
                        <div class="text-center mb-4">
                            <i class="bi bi-receipt-cutoff text-primary fs-1"></i>
                            <h1 class="h4 mt-2" th:text="#{app.name}">経費精算システム</h1>
                            <p class="text-muted small" th:text="#{login.title}">ログイン</p>
                        </div>

                        <div class="alert alert-danger py-2" th:if="${errorMessageKey}">
                            <i class="bi bi-exclamation-circle me-1"></i>
                            <span th:text="#{__${errorMessageKey}__}">エラー</span>
                        </div>
                        <div class="alert alert-success py-2" th:if="${successMessageKey}">
                            <i class="bi bi-check-circle me-1"></i>
                            <span th:text="#{__${successMessageKey}__}">成功</span>
                        </div>

                        <form th:action="@{/login}" method="post">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                            <div class="mb-3">
                                <label for="username" class="form-label" th:text="#{login.username}">ユーザー名</label>
                                <input type="text" class="form-control" id="username" name="username" required autofocus>
                            </div>
                            <div class="mb-4">
                                <label for="password" class="form-label" th:text="#{login.password}">パスワード</label>
                                <input type="password" class="form-control" id="password" name="password" required>
                            </div>
                            <button type="submit" class="btn btn-primary w-100">
                                <i class="bi bi-box-arrow-in-right me-1"></i>
                                <span th:text="#{login.submit}">ログイン</span>
                            </button>
                        </form>
                    </div>
                </div>
                <p class="text-center text-white-50 small mt-3 mb-0" th:text="#{app.footer}"></p>
            </div>
        </div>
    </div>
</div>
<th:block th:replace="~{layout/fragments :: scripts}"></th:block>
</body>
</html>
