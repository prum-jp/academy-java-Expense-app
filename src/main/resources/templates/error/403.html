<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/fragments :: head(#{error.forbidden.title})}"></head>
<body class="app-body">
<nav th:replace="~{layout/fragments :: navbar}"></nav>

<main class="app-main">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card app-card text-center p-5">
                    <i class="bi bi-shield-lock text-danger display-4"></i>
                    <h1 class="h3 mt-3" th:text="#{error.forbidden.title}">アクセスが拒否されました</h1>
                    <p class="text-muted" th:text="#{error.access.denied}">アクセス権限がありません。</p>
                    <a th:href="@{/}" class="btn btn-primary mt-2">ホームへ戻る</a>
                </div>
            </div>
        </div>
    </div>
</main>

<footer th:replace="~{layout/fragments :: footer}"></footer>
<th:block th:replace="~{layout/fragments :: scripts}"></th:block>
</body>
</html>
