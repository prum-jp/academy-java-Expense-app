<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/fragments :: head(#{expense.detail.title})}"></head>
<body class="app-body">
<nav th:replace="~{layout/fragments :: navbar}"></nav>
<div th:replace="~{layout/fragments :: alerts}"></div>

<main class="app-main">
    <div class="container">
        <div class="d-flex flex-wrap justify-content-between align-items-start gap-3 mb-4">
            <div>
                <h1 class="page-title" th:text="#{expense.detail.title}">経費申請詳細</h1>
                <p class="page-subtitle mb-0" th:text="${expense.title}">件名</p>
            </div>
            <div class="d-flex flex-wrap gap-2">
                <a th:href="@{/expenses}" class="btn btn-outline-secondary">
                    <i class="bi bi-arrow-left me-1"></i><span th:text="#{common.back}">戻る</span>
                </a>
                <a th:if="${editable}" th:href="@{/expenses/{id}/edit(id=${expense.expenseId})}" class="btn btn-outline-primary">
                    <i class="bi bi-pencil me-1"></i><span th:text="#{common.edit}">編集</span>
                </a>
            </div>
        </div>

        <div class="row g-4">
            <div class="col-lg-8">
                <div class="card app-card mb-4">
                    <div class="card-header d-flex justify-content-between align-items-center">
                        <span>基本情報</span>
                        <span class="badge status-badge"
                              th:classappend="${expense.status.name() == 'DRAFT'} ? 'bg-secondary' :
                              (${expense.status.name() == 'PENDING'} ? 'bg-warning text-dark' :
                              (${expense.status.name() == 'APPROVED'} ? 'bg-success' : 'bg-danger'))"
                              th:text="#{|expense.status.${expense.status}|}">ステータス</span>
                    </div>
                    <div class="card-body">
                        <dl class="row mb-0">
                            <dt class="col-sm-4" th:text="#{expense.field.title}">件名</dt>
                            <dd class="col-sm-8" th:text="${expense.title}">-</dd>
                            <dt class="col-sm-4" th:text="#{expense.field.totalAmount}">合計金額</dt>
                            <dd class="col-sm-8 amount-cell">
                                <span th:text="${#numbers.formatInteger(expense.totalAmount, 0, 'COMMA')} + ' 円'">0 円</span>
                            </dd>
                            <dt class="col-sm-4" th:text="#{expense.field.submittedAt}">申請日時</dt>
                            <dd class="col-sm-8">
                                <span th:if="${expense.submittedAt != null}"
                                      th:text="${#temporals.format(expense.submittedAt, 'yyyy/MM/dd HH:mm')}">-</span>
                                <span th:if="${expense.submittedAt == null}" class="text-muted">-</span>
                            </dd>
                            <dt class="col-sm-4">申請者</dt>
                            <dd class="col-sm-8" th:if="${expense.applicant != null}">
                                <span th:text="${expense.applicant.userName}">name</span>
                                <span class="text-muted" th:text="'（' + ${expense.applicant.department.deptName} + '）'"></span>
                            </dd>
                        </dl>
                    </div>
                </div>

                <div class="card app-card mb-4">
                    <div class="card-header">明細</div>
                    <div class="card-body p-0">
                        <div class="table-responsive">
                            <table class="table table-app mb-0">
                                <thead>
                                <tr>
                                    <th th:text="#{expense.field.expenseDate}">利用日</th>
                                    <th th:text="#{expense.field.category}">科目</th>
                                    <th th:text="#{expense.field.taxRate}">税率</th>
                                    <th class="text-end" th:text="#{expense.field.amount}">金額</th>
                                    <th th:text="#{expense.field.memo}">メモ</th>
                                </tr>
                                </thead>
                                <tbody>
                                <tr th:each="detail : ${expense.details}">
                                    <td th:text="${#temporals.format(detail.expenseDate, 'yyyy/MM/dd')}">-</td>
                                    <td th:text="${detail.category != null ? detail.category.categoryName : '-'}">-</td>
                                    <td th:text="${detail.taxRate != null ? detail.taxRate.description : '-'}">-</td>
                                    <td class="amount-cell" th:text="${#numbers.formatInteger(detail.amount, 0, 'COMMA')} + ' 円'">0</td>
                                    <td th:text="${detail.memo != null ? detail.memo : '-'}">-</td>
                                </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>

                <div class="card app-card">
                    <div class="card-header" th:text="#{expense.field.receipt}">領収書</div>
                    <div class="card-body">
                        <div class="row g-3 mb-3" th:if="${!#lists.isEmpty(expense.receiptImages)}">
                            <div class="col-md-4" th:each="image : ${expense.receiptImages}">
                                <div class="border rounded p-2 h-100">
                                    <a th:href="@{/expenses/{eid}/receipts/{iid}(eid=${expense.expenseId}, iid=${image.imageId})}"
                                       target="_blank" class="d-block text-center">
                                        <img th:if="${!#strings.endsWith(image.filePath, '.pdf')}"
                                             th:src="@{/expenses/{eid}/receipts/{iid}(eid=${expense.expenseId}, iid=${image.imageId})}"
                                             class="receipt-thumb img-fluid" alt="領収書">
                                        <div th:if="${#strings.endsWith(image.filePath, '.pdf')}" class="py-4">
                                            <i class="bi bi-file-earmark-pdf fs-1 text-danger"></i>
                                            <div class="small mt-2" th:text="${image.filePath}">PDF</div>
                                        </div>
                                    </a>
                                    <div class="text-muted small mt-2 text-center"
                                         th:text="${#temporals.format(image.uploadedAt, 'yyyy/MM/dd HH:mm')}"></div>
                                    <form th:if="${editable}"
                                          th:action="@{/expenses/{eid}/receipts/{iid}/delete(eid=${expense.expenseId}, iid=${image.imageId})}"
                                          method="post" class="mt-2"
                                          onsubmit="return confirm('この領収書を削除しますか？');">
                                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                                        <input type="hidden" name="version" th:value="${expense.version}">
                                        <button type="submit" class="btn btn-sm btn-outline-danger w-100">
                                            <i class="bi bi-trash me-1"></i>削除
                                        </button>
                                    </form>
                                </div>
                            </div>
                        </div>
                        <p th:if="${#lists.isEmpty(expense.receiptImages)}" class="text-muted mb-3">
                            領収書は未登録です。申請するには1件以上必要です。
                        </p>

                        <form th:if="${editable}" th:action="@{/expenses/{id}/receipts(id=${expense.expenseId})}"
                              method="post" enctype="multipart/form-data" class="row g-2 align-items-end">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                            <input type="hidden" name="version" th:value="${expense.version}">
                            <div class="col-md-8">
                                <input type="file" class="form-control" name="file" accept=".jpg,.jpeg,.png,.pdf" required>
                            </div>
                            <div class="col-md-4">
                                <button type="submit" class="btn btn-outline-primary w-100">
                                    <i class="bi bi-upload me-1"></i>アップロード
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>

            <div class="col-lg-4">
                <div class="card app-card mb-4" th:if="${editable}">
                    <div class="card-header">操作</div>
                    <div class="card-body d-grid gap-2">
                        <form th:action="@{/expenses/{id}/submit(id=${expense.expenseId})}" method="post">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                            <input type="hidden" name="version" th:value="${expense.version}">
                            <button type="submit" class="btn btn-primary w-100"
                                    th:disabled="${#lists.isEmpty(expense.details)}">
                                <i class="bi bi-send me-1"></i><span th:text="#{common.submit}">申請</span>
                            </button>
                            <p class="text-muted small mb-0 mt-2"
                               th:if="${#lists.isEmpty(expense.receiptImages)}">申請するには領収書が必要です。</p>
                        </form>
                        <form th:action="@{/expenses/{id}/delete(id=${expense.expenseId})}" method="post"
                              onsubmit="return confirm('削除してよろしいですか？');">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                            <input type="hidden" name="version" th:value="${expense.version}">
                            <button type="submit" class="btn btn-outline-danger w-100">
                                <i class="bi bi-trash me-1"></i><span th:text="#{common.delete}">削除</span>
                            </button>
                        </form>
                    </div>
                </div>

                <div class="card app-card">
                    <div class="card-header" th:text="#{approval.history}">承認履歴</div>
                    <div class="card-body">
                        <div class="history-timeline" th:if="${!#lists.isEmpty(expense.approvalHistories)}">
                            <div class="history-item" th:each="history : ${expense.approvalHistories}">
                                <div class="fw-semibold" th:text="#{|approval.action.${history.action}|}">申請</div>
                                <div class="small text-muted">
                                    <span th:text="${history.approver != null ? history.approver.userName : '-'}">user</span>
                                    ·
                                    <span th:text="${#temporals.format(history.createdAt, 'yyyy/MM/dd HH:mm')}">date</span>
                                </div>
                                <div class="small mt-1" th:if="${history.comment != null}" th:text="${history.comment}"></div>
                            </div>
                        </div>
                        <p th:if="${#lists.isEmpty(expense.approvalHistories)}" class="text-muted mb-0">履歴はありません。</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>

<footer th:replace="~{layout/fragments :: footer}"></footer>
<th:block th:replace="~{layout/fragments :: scripts}"></th:block>
</body>
</html>
