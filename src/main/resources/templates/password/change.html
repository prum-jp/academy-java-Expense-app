<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/fragments :: head(#{password.title})}"></head>
<body class="app-body">
<nav th:replace="~{layout/fragments :: navbar}"></nav>
<div th:replace="~{layout/fragments :: alerts}"></div>

<main class="app-main">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-6">
                <h1 class="page-title" th:text="#{password.title}">パスワード変更</h1>
                <p class="page-subtitle">セキュリティのため定期的な変更を推奨します。</p>

                <div class="card app-card">
                    <div class="card-body p-4">
                        <form th:action="@{/password/change}" th:object="${passwordForm}" method="post">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

                            <div class="mb-3">
                                <label for="currentPassword" class="form-label" th:text="#{password.current}">現在のパスワード</label>
                                <input type="password" class="form-control" id="currentPassword"
                                       th:field="*{currentPassword}" required>
                                <div class="text-danger small" th:errors="*{currentPassword}"></div>
                            </div>
                            <div class="mb-3">
                                <label for="newPassword" class="form-label" th:text="#{password.new}">新しいパスワード</label>
                                <input type="password" class="form-control" id="newPassword"
                                       th:field="*{newPassword}" required minlength="8">
                                <div class="text-danger small" th:errors="*{newPassword}"></div>
                            </div>
                            <div class="mb-4">
                                <label for="confirmPassword" class="form-label" th:text="#{password.confirm}">確認</label>
                                <input type="password" class="form-control" id="confirmPassword"
                                       th:field="*{confirmPassword}" required>
                                <div class="text-danger small" th:errors="*{confirmPassword}"></div>
                            </div>

                            <div class="d-flex gap-2">
                                <button type="submit" class="btn btn-primary">
                                    <i class="bi bi-check-lg me-1"></i><span th:text="#{password.submit}">変更</span>
                                </button>
                                <a th:href="@{/}" class="btn btn-outline-secondary" th:text="#{common.cancel}">キャンセル</a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>

<footer th:replace="~{layout/fragments :: footer}"></footer>
<th:block th:replace="~{layout/fragments :: scripts}"></th:block>
</body>
</html>
